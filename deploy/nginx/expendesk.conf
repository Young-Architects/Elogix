# nginx reverse proxy for the self-hosted (Hostinger VPS) deploy.
#
# Install:
#   sudo cp deploy/nginx/expendesk.conf /etc/nginx/sites-available/expendesk
#   sudo ln -s /etc/nginx/sites-available/expendesk /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot, which rewrites this file in place to add the TLS listener
# and the :80 -> :443 redirect:
#   sudo certbot --nginx -d expendesk.com -d www.expendesk.com
#
# Why a reverse proxy at all, rather than exposing `next start` on :80 --
# nginx absorbs malformed requests, slow-loris connections, payload limits and
# rate limiting, so the Node process spends its cycles rendering. This is what
# the Next.js self-hosting guide recommends.

upstream expendesk_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name expendesk.com www.expendesk.com;

    # --- Apex -> www ---------------------------------------------------
    # Vercel did this for us. Without it the apex serves a byte-identical
    # copy of the entire site, which competes with www in Google for every
    # query and undoes the canonical consolidation work. This is the single
    # easiest thing to forget in the migration.
    if ($host = expendesk.com) {
        return 301 https://www.expendesk.com$request_uri;
    }

    # Next.js sets its own Cache-Control on these; they are content-hashed
    # and safe to cache forever. Served through the proxy rather than from
    # disk so a `pm2 reload` mid-request can never serve a half-written file.
    location /_next/static/ {
        proxy_pass http://expendesk_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://expendesk_app;
        proxy_http_version 1.1;

        # X-Forwarded-Proto is what tells Next.js the original request was
        # HTTPS. Omit it and anything deriving an absolute URL from the
        # request -- canonical tags, OG image URLs, redirects -- emits
        # http:// links on an https:// site.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        # /api/chat proxies to n8n and declares maxDuration = 60, so the
        # read timeout must clear that or nginx returns 504 while the route
        # is still legitimately working.
        proxy_read_timeout 90s;
    }

    client_max_body_size 10M;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss image/svg+xml;
    gzip_min_length 1024;
}
